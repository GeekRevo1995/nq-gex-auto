name: NQ GEX Auto-Export

on:
  schedule:
    - cron: '*/10 13-21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-gex.txt

      - name: Run GEX export
        run: python gex_auto_export.py

      - name: Commit and push if changed
        run: |
          git config user.name "gex-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gex_nq_0dte.json
          git diff --staged --quiet || git commit -m "auto: update NQ GEX snapshot"
          git push
